name: CI

# Runs only for pushes to the `ci` branch or any branch starting with `ci` (e.g. `ci-windows`), plus manual runs.
on:
  push:
    branches: ['ci', 'ci*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Catch path / shebang / bin issues on other platforms (drop if the package is Linux-only).
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: node scripts/smoke.mjs --no-build
