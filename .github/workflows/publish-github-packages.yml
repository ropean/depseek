# Publishes the package to GitHub Packages (npm registry at npm.pkg.github.com) when a v* tag is pushed.
# Auth: the built-in GITHUB_TOKEN (no secret needed). The package scope must equal the repository owner
# (@ropean/depseek ↔ github.com/ropean). If the version is already there, the publish step is skipped.
#
# Install (needs a GitHub token with read:packages, even for public packages):
#   echo "@ropean:registry=https://npm.pkg.github.com" >> ~/.npmrc
#   echo "//npm.pkg.github.com/:_authToken=<token>" >> ~/.npmrc
#   npm i -g @ropean/depseek
name: Publish to GitHub Packages

on:
  push:
    tags: ['v*']
  # Manual retry for an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.2.3'
        required: true

concurrency:
  group: publish-gpr-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      REGISTRY: https://npm.pkg.github.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10 # package.json has no `packageManager` field, so pin the pnpm major here
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify tag, scope and existing version
        id: meta
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"; exit 1
          fi
          if [ "${NAME%%/*}" != "@$OWNER" ]; then
            echo "::error::GitHub Packages requires the scope to match the repository owner: expected @$OWNER/..., got $NAME"; exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            ID=$(echo "$VERSION" | sed -E 's/^[^-]+-([a-zA-Z]+).*/\1/'); [[ "$ID" =~ ^[a-zA-Z]+$ ]] || ID=next
            echo "tag=$ID" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          if npm view "$NAME@$VERSION" version --registry "$REGISTRY" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - run: pnpm run check
        if: steps.meta.outputs.published == 'false'
      - run: node scripts/smoke.mjs --no-build
        if: steps.meta.outputs.published == 'false'

      - name: Publish
        if: steps.meta.outputs.published == 'false'
        run: |
          # package.json's publishConfig points at npmjs.org; drop it for this (ephemeral) checkout.
          npm pkg delete publishConfig.registry
          npm publish --registry "$REGISTRY" --tag ${{ steps.meta.outputs.tag }} --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
